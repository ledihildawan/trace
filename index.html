<!DOCTYPE html>
<html lang="id" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch-zoom stays enabled (WCAG 1.4.4); #viewport already sets
         touch-action: pan-y so zoom never fights the scroll gesture. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TRACE — The Shape of Time. A digital instrument to visualize the sensation of time passing across the entire year." />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TRACE — The Shape of Time</title>
    <!-- Self-hosted: no third-party request, no render-blocking round trip to
         two extra origins, and the app still looks right offline. -->
    <link rel="preload" href="assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="assets/fonts/space-grotesk.css" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader-bar"><div class="loader-progress" id="load-progress"></div></div>
      <div class="loader-text" id="load-status">Menyelaraskan perjalanan waktu…</div>
    </div>
    <div id="ion-drive" aria-hidden="true"></div>
    <div id="atmosphere" aria-hidden="true"></div>
    <div id="theme-veil" aria-hidden="true"></div>
    <div id="toast" aria-live="polite"></div>
    <nav id="year-nav" class="year-nav" aria-label="Tahun sebelumnya">
      <button data-nav="prev" class="year-nav-btn" aria-label="Tahun sebelumnya" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </nav>
    <nav id="year-nav-end" class="year-nav" aria-label="Tahun berikutnya">
      <button data-nav="next" class="year-nav-btn" aria-label="Tahun berikutnya" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </nav>
    <div id="keyboard-hints" class="keyboard-hints">
      <span><kbd>F</kbd> Fokus</span>
      <span><kbd>G</kbd> Lompat</span>
      <span><kbd>/</kbd> Cari</span>
      <span><kbd>←</kbd><kbd>→</kbd> Hari</span>
      <span><kbd>Space</kbd> Hari ini</span>
      <span><kbd>↑</kbd><kbd>↓</kbd> Tahun</span>
      <span><kbd>T</kbd> Tema</span>
    </div>
    <main id="viewport" aria-label="Grid perjalanan waktu"><div id="infinite-canvas"></div></main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
