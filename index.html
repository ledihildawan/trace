<!DOCTYPE html>
<html lang="id" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch-zoom stays enabled (WCAG 1.4.4); #viewport already sets
         touch-action: pan-y so zoom never fights the scroll gesture. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TRACE — The Shape of Time. A digital instrument to visualize the sensation of time passing across the entire year." />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TRACE — The Shape of Time</title>
    <!-- Self-hosted: no third-party request, no render-blocking round trip to
         two extra origins, and the app still looks right offline. -->
    <link rel="preload" href="assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="assets/fonts/space-grotesk.css" />
    <style>
      /* --- CORE CSS ENGINE --- */
      @property --ion-x {
        syntax: '<number>';
        inherits: true;
        initial-value: 0;
      }
      @property --ion-y {
        syntax: '<number>';
        inherits: true;
        initial-value: 0;
      }
      @property --warp-scale {
        syntax: '<number>';
        inherits: true;
        initial-value: 0.92;
      }
      @property --ion-glow {
        syntax: '<length>';
        inherits: true;
        initial-value: 700px;
      }
      @property --chroma-dist {
        syntax: '<number>';
        inherits: true;
        initial-value: 0;
      }

      :root {
        /* Palette in OKLCH: perceptually uniform, so lightness/chroma can be
           nudged predictably and color-mix() never dips through mud. Every
           value round-trips to the exact sRGB hex it replaced — this changed
           the color space, not the design. */
        --accent-primary: light-dark(oklch(45.68% 0.2146 277.02), oklch(83.69% 0.1644 84.43));
        --accent-secondary: light-dark(oklch(50% 0.1193 242.75), oklch(79.71% 0.1339 211.53));
        --today-glow: light-dark(oklch(45.68% 0.2146 277.02 / 0.3), oklch(62.31% 0.188 259.81 / 0.6));
        --bg: light-dark(oklch(98.42% 0.0034 247.86), oklch(12.88% 0.0406 264.7));
        --border: light-dark(oklch(92.88% 0.0126 255.51), oklch(27.95% 0.0368 260.03));
        --cell-bg: light-dark(oklch(100% 0 0), oklch(12.88% 0.0406 264.7));
        --text-main: light-dark(oklch(20.77% 0.0398 265.75), oklch(96.83% 0.0069 247.9));
        --text-muted: light-dark(oklch(44.55% 0.0374 257.28), oklch(55.44% 0.0407 257.42));

        /* Debu luar angkasa yang lebih halus */
        --dust-opacity: light-dark(0.04, 0.12);

        --ion-primary: var(--accent-primary);
        --ion-secondary: var(--accent-secondary);
        --ion-blend: light-dark(multiply, screen);
        --ion-opacity: light-dark(0.4, 0.85); /* Kurangi opacity di light mode agar elegan */
        --ion-glow: 700px;

        /* Permukaan melayang (panel hari, jump-to-date). Harus ikut tema:
           sebelumnya gelap permanen sementara teksnya --text-main, jadi tema
           terang menghasilkan teks hitam di atas navy — tidak terbaca. */
        --surface: light-dark(rgba(255, 255, 255, 0.94), rgba(15, 23, 42, 0.92));
        --surface-sunken: light-dark(rgba(241, 245, 249, 0.9), rgba(2, 6, 23, 0.6));
        --surface-border: light-dark(rgba(3, 105, 161, 0.28), rgba(34, 211, 238, 0.25));
        --surface-scrim: light-dark(rgba(100, 116, 139, 0.35), rgba(2, 6, 23, 0.55));
        --surface-shadow: light-dark(rgba(15, 23, 42, 0.18), rgba(0, 0, 0, 0.6));
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100dvh;
        width: 100vw;
        background: var(--bg);
        color: var(--text-main);
        /* Metric-ish fallbacks so the pre-swap frame is not a wild reflow. */
        font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
        perspective: 2000px;
        overscroll-behavior: none;
        contain: strict;
      }

      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 100000;
        background: #020617;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.6s ease-out, visibility 0.6s;
      }
      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }
      .loader-text {
        color: var(--accent-secondary);
        font-size: 10px;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        font-weight: 900;
        margin-top: 20px;
        text-align: center;
      }
      .loader-bar {
        width: 150px;
        height: 1px;
        background: rgba(34, 211, 238, 0.2);
        position: relative;
        overflow: hidden;
      }
      .loader-progress {
        position: absolute;
        height: 100%;
        width: 0%;
        background: var(--accent-secondary);
        transition: width 0.4s ease;
      }

      @media (pointer: fine) {
        * {
          cursor: none !important;
        }
      }

      /* ── ION DRIVE ── */
      #ion-drive {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        /* color-mix in oklab keeps the glow's tint true at low percentages.
           No gradient interpolation hint here: these fade to `transparent`,
           and CSS already interpolates alpha premultiplied, so there is no
           grey dip to fix — an invalid hint would kill the whole declaration. */
        background: radial-gradient(
            var(--ion-glow) circle at calc(var(--ion-x) * 1px) calc(var(--ion-y) * 1px),
            color-mix(in oklab, var(--ion-secondary) 15%, transparent) 0%,
            transparent 60%
          ),
          radial-gradient(
            50px circle at calc(var(--ion-x) * 1px) calc(var(--ion-y) * 1px),
            color-mix(in oklab, var(--ion-primary) 60%, transparent) 0%,
            transparent 100%
          );
        opacity: var(--ion-opacity);
        mix-blend-mode: var(--ion-blend);
        transition: opacity 0.5s ease, background 0.3s ease, --ion-glow 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        will-change: transform;
        transform: translateZ(0);
      }

      #atmosphere {
        position: fixed;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        opacity: var(--dust-opacity);
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        mix-blend-mode: overlay;
        animation: drift 60s linear infinite;
      }
      @keyframes drift {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 400px 400px;
        }
      }

      #viewport {
        width: 100vw;
        height: 100dvh;
        overflow-y: scroll;
        scroll-snap-type: none;
        scrollbar-width: none;
        position: relative;
        overscroll-behavior: none;
        touch-action: pan-y;
        -webkit-overflow-scrolling: auto;
      }
      #viewport.is-locked {
        pointer-events: none !important;
      }
      #viewport::-webkit-scrollbar {
        display: none;
      }

      /* Accessibility */
      :focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }
      .cell:focus-visible {
        outline: none;
        z-index: 20;
        box-shadow: inset 0 0 0 2px var(--accent-secondary),
          0 0 24px rgba(34, 211, 238, 0.45);
      }
      /* Days that hold data: a glowing mood dot + subtle tint (the "shape of time"). */
      .cell.has-data {
        background: linear-gradient(
          135deg in oklab,
          color-mix(in oklab, var(--mood-color, var(--accent-secondary)) 22%, var(--cell-bg)) 0%,
          var(--cell-bg) 100%
        );
      }
      .cell.has-data::before {
        content: '';
        position: absolute;
        top: 5px;
        right: 5px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--mood-color, var(--accent-secondary));
        box-shadow: 0 0 8px var(--mood-color, var(--accent-secondary));
        z-index: 4;
      }
      /* ── Floating surfaces: native <dialog> in the top layer ── */
      /* showModal() gives focus trapping, Escape, inert background and
         z-index-free stacking for free. @starting-style + allow-discrete
         animate the open/close transition with no JS timers involved. */
      .day-panel,
      .date-jumper {
        border: none;
        color: var(--text-main);
        background: var(--surface);
        border: 1px solid var(--surface-border);
        box-shadow: 0 24px 70px var(--surface-shadow);
        opacity: 0;
        transition:
          opacity 0.2s ease,
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
          display 0.25s allow-discrete,
          overlay 0.25s allow-discrete;
      }
      .day-panel[open],
      .date-jumper[open] {
        opacity: 1;
        transform: none;
      }
      @starting-style {
        .day-panel[open],
        .date-jumper[open] {
          opacity: 0;
        }
      }

      .day-panel::backdrop,
      .date-jumper::backdrop {
        background: var(--surface-scrim);
        backdrop-filter: blur(6px);
        opacity: 0;
        transition:
          opacity 0.2s ease,
          display 0.2s allow-discrete,
          overlay 0.2s allow-discrete;
      }
      .day-panel[open]::backdrop,
      .date-jumper[open]::backdrop {
        opacity: 1;
      }
      @starting-style {
        .day-panel[open]::backdrop,
        .date-jumper[open]::backdrop {
          opacity: 0;
        }
      }

      .day-panel {
        width: min(420px, 92vw);
        border-radius: 16px;
        padding: 22px;
        transform: translateY(12px) scale(0.96);
        flex-direction: column;
        gap: 14px;
      }
      .day-panel[open] {
        display: flex;
      }
      .day-panel-title {
        font-weight: 900;
        font-size: 15px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-wrap: balance;
      }
      .day-panel-moods {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .day-panel-note {
        width: 100%;
        resize: vertical;
        background: var(--surface-sunken);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        color: inherit;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.5;
        outline: none;
        user-select: text;
        field-sizing: content;
        max-height: 40dvh;
      }
      .day-panel-done {
        align-self: flex-end;
        background: color-mix(in oklab, var(--accent-secondary) 15%, transparent);
        border: 1px solid color-mix(in oklab, var(--accent-secondary) 45%, transparent);
        color: var(--accent-secondary);
        border-radius: 20px;
        padding: 7px 18px;
        font-family: inherit;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .date-jumper {
        min-width: min(300px, 90vw);
        border-radius: 14px;
        padding: 18px 20px;
        backdrop-filter: blur(20px) saturate(180%);
        transform: scale(0.96);
        flex-direction: column;
        gap: 10px;
      }
      .date-jumper[open] {
        display: flex;
      }
      .date-jumper input {
        background: transparent;
        border: none;
        outline: none;
        color: inherit;
        font-family: inherit;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.05em;
        width: 100%;
        user-select: text;
      }
      /* ── Note search ── */
      .note-search {
        width: min(560px, 94vw);
        max-height: min(70dvh, 620px);
        border-radius: 16px;
        padding: 16px 18px;
        transform: translateY(-8px) scale(0.98);
        flex-direction: column;
        gap: 12px;
        overflow: hidden;
      }
      .note-search[open] {
        display: flex;
      }
      .note-search-input {
        background: var(--surface-sunken);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        color: inherit;
        font-family: inherit;
        font-weight: 700;
        font-size: 16px;
        outline: none;
        user-select: text;
        width: 100%;
      }
      .note-search-input:focus-visible {
        border-color: var(--accent-secondary);
      }
      .note-search-results {
        list-style: none;
        overflow-y: auto;
        overscroll-behavior: contain;
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin: 0;
      }
      .note-hit {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr);
        grid-template-areas: 'mood date' 'mood text';
        gap: 2px 10px;
        align-items: baseline;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .note-hit.is-active,
      .note-hit:hover {
        background: color-mix(in oklab, var(--accent-secondary) 14%, transparent);
      }
      .note-hit-mood {
        grid-area: mood;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        align-self: center;
      }
      .note-hit-date {
        grid-area: date;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent-secondary);
      }
      .note-hit-text {
        grid-area: text;
        font-size: 13px;
        line-height: 1.45;
        color: var(--text-main);
        overflow-wrap: anywhere;
      }
      .note-hit-text mark {
        background: color-mix(in oklab, var(--accent-primary) 40%, transparent);
        color: inherit;
        border-radius: 3px;
      }
      .note-search-status {
        font-size: 9px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-muted);
        font-weight: 700;
      }

      .date-jumper-hint {
        font-size: 9px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-muted);
        font-weight: 700;
      }

      /* Mood picker buttons in the day panel. */
      .mood-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        opacity: 0.45;
        transition: transform 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
      }
      .mood-btn:hover {
        transform: scale(1.15);
        opacity: 0.9;
      }
      .mood-btn[aria-pressed='true'] {
        opacity: 1;
        /* was #fff — invisible against the light-theme panel */
        border-color: var(--text-main);
        transform: scale(1.12);
      }
      /* "You are here" year scrubber on the right edge. */
      .pos-scrubber {
        position: fixed;
        top: 0;
        right: 0;
        width: 14px;
        height: 100dvh;
        z-index: 9996;
        cursor: pointer;
        touch-action: none;
      }
      .pos-scrubber::before {
        content: '';
        position: absolute;
        top: 8%;
        left: 50%;
        transform: translateX(-50%);
        width: 2px;
        height: 84%;
        background: linear-gradient(to bottom, transparent, var(--border), transparent);
      }
      .pos-scrubber:focus-visible {
        outline: 2px solid var(--accent-secondary);
        outline-offset: -2px;
      }
      .pos-today {
        position: absolute;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 10px;
        height: 2px;
        background: var(--accent-primary);
        box-shadow: 0 0 6px var(--accent-primary);
      }
      .pos-thumb {
        position: absolute;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 8px;
        height: 18px;
        border-radius: 4px;
        background: var(--accent-secondary);
        box-shadow: 0 0 10px var(--accent-secondary);
        transition: top 0.08s linear;
      }
      @media (max-width: 720px) {
        .pos-scrubber {
          width: 18px;
        }
      }

      /* Some users find heavy blur and translucency disorienting or simply
         hard to read through. Give them opaque surfaces without changing the
         layout or the palette. */
      @media (prefers-reduced-transparency: reduce) {
        .day-panel,
        .date-jumper,
        #toast,
        .year-nav-btn {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
          background: var(--bg);
        }
        .day-panel::backdrop,
        .date-jumper::backdrop {
          backdrop-filter: none;
          background: light-dark(rgba(226, 232, 240, 0.92), rgba(2, 6, 23, 0.92));
        }
        #atmosphere {
          display: none;
        }
        .day-panel-note {
          background: var(--cell-bg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #viewport {
          scroll-behavior: auto !important;
          scroll-snap-type: none !important;
          overscroll-behavior: none !important;
        }
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        /* Scroll-driven animations ignore animation-duration, so disable explicitly. */
        .year-block.active .watermark-embedded {
          animation: none !important;
        }
      }
      #infinite-canvas {
        position: relative;
        width: 100%;
        contain: layout;
      }

      .year-block {
        position: absolute;
        left: 0;
        width: 100vw;
        height: 100dvh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        content-visibility: auto;
        contain-intrinsic-size: 100vw 100dvh;
        backface-visibility: hidden;
        transform: translateZ(0);
        transform-origin: center center;
        transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), filter 1s ease, opacity 0.8s ease;
        will-change: transform, opacity, filter;
        contain: strict;
      }

      .year-block:not(.active) {
        transform: scale(0.8) translate3d(0, 0, -600px);
        filter: blur(20px) grayscale(0.5);
        opacity: 0.15;
      }

      .year-block:not(.active) .date-num {
        background: var(--text-muted);
        color: transparent !important;
        height: 1px;
        width: 40%;
        margin: 10px auto;
        opacity: 0.5;
      }
      .year-block:not(.active) .info-meta {
        opacity: 0;
      }

      .year-block.active {
        transform: scale(1) translate3d(0, 0, 0);
        filter: blur(0px);
        opacity: 1;
      }

      .grid-container {
        position: relative;
        flex: 1;
        display: flex;
        background: var(--bg);
        overflow-x: hidden;
        scrollbar-width: none;
        filter: drop-shadow(calc(var(--chroma-dist) * -1px) 0 0 rgba(255, 0, 0, 0.2))
          drop-shadow(calc(var(--chroma-dist) * 1px) 0 0 rgba(0, 255, 255, 0.2));
        backface-visibility: hidden;
        transform: translateZ(0); /* Force GPU layering */
        will-change: transform, filter;
      }

      .watermark-embedded {
        position: absolute;
        top: 0;
        right: 5%;
        height: 100%;
        display: flex;
        align-items: center;
        font-size: clamp(100px, 30dvh, 400px);
        font-weight: 900;
        color: transparent;
        /* Amber → cyan in dark mode: sRGB interpolation drags this through a
           dull olive midpoint. oklab keeps the ramp clean. */
        background: linear-gradient(180deg in oklab, var(--accent-primary), var(--accent-secondary), transparent);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-stroke: 1px rgba(148, 163, 184, 0.1);
        writing-mode: vertical-rl;
        pointer-events: none;
        opacity: 0;
        z-index: 10;
        transition: opacity 1s;
        will-change: transform;
      }
      .year-block.active .watermark-embedded {
        opacity: 0.15;
      }
      /* Parallax runs on the compositor via a scroll-driven view() timeline —
         zero JS per frame. Gated on @supports so older browsers see a static
         watermark instead of a stuck offset. */
      @supports (animation-timeline: view()) {
        .year-block.active .watermark-embedded {
          animation: watermark-drift linear both;
          animation-timeline: view();
        }
      }
      @keyframes watermark-drift {
        from { transform: translate3d(0, -7%, 0); }
        to { transform: translate3d(0, 7%, 0); }
      }
      .year-block.is-scrolling .watermark-embedded {
        position: fixed;
        opacity: 0.08;
        animation: none;
      }

      .grid-layer {
        display: grid;
        width: 100.1%;
        margin-left: -0.5px;
        min-height: 100%;
        opacity: 0;
        transition: opacity 0.8s ease;
        z-index: 2;
        gap: 0;
        background: transparent;
      }
      .year-block.active .grid-layer {
        opacity: 1;
      }
      /* ARIA needs grid > row > gridcell, but the cells must stay direct
         participants of the CSS grid — display: contents gives us both. */
      .grid-row {
        display: contents;
      }

      .cell {
        background: var(--cell-bg);
        position: relative;
        box-shadow: inset 0 0 0 0.5px var(--border);
        display: flex;
        flex-direction: column;
        transition: background 0.4s ease, opacity 0.4s ease;
        contain: content;
      }
      .cell.filler {
        opacity: 0.15;
        background: transparent;
        pointer-events: auto;
      }
      .cell.weekend {
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.03) 0%, transparent 100%);
      }
      .cell.week-start {
        background: linear-gradient(135deg, rgba(251, 191, 36, 0.05) 0%, transparent 100%);
      }
      .cell.week-start::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, var(--accent-primary), transparent);
        opacity: 0.2;
        z-index: 3;
      }
      .cell.month-start {
        background: linear-gradient(180deg, rgba(34, 211, 238, 0.08) 0%, transparent 100%);
        box-shadow: inset 0 2px 0 0 var(--accent-secondary), inset 0 0 0 0.5px var(--border);
      }
      .cell.month-start .info-meta.top-label {
        color: var(--accent-secondary);
        font-weight: 900;
        letter-spacing: 0.15em;
      }

      /* ── Temporal fading ── Days already lived recede rather than vanish;
         a day you actually recorded stays more present than an empty one.
         Opacity on the content only: a filter here would promote ~400 cells
         per year to their own compositing layers. */
      .cell.past .cell-content {
        opacity: 0.42;
        transition: opacity 0.4s ease;
      }
      .cell.past.has-data .cell-content {
        opacity: 0.85;
      }

      /* ── The pulse of now ── Today fills gradually as the day is spent.
         --day-progress is published once a minute by DayPulse. */
      .day-pulse {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(var(--day-progress, 0) * 100%);
        background: linear-gradient(
          to top,
          color-mix(in oklab, #fff 26%, transparent),
          transparent
        );
        pointer-events: none;
        z-index: 1;
        transition: height 1s linear;
      }
      @media (prefers-reduced-motion: reduce) {
        .day-pulse {
          transition: none;
        }
      }

      .cell.today {
        background: linear-gradient(
          135deg in oklab,
          oklch(54.61% 0.2152 262.88) 0%,
          oklch(42.44% 0.1809 265.64) 100%
        );
        z-index: 10;
        box-shadow: 0 10px 30px -5px var(--today-glow), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
      }
      .cell.today .date-num {
        font-weight: 900;
        color: #fff !important;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }
      .cell.today .info-meta {
        color: rgba(255, 255, 255, 0.9);
        font-weight: 700;
      }

      .cell-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 8px 4px;
        z-index: 2;
        pointer-events: none;
      }
      .info-meta {
        font-size: clamp(6px, 0.8dvh, 8px);
        text-transform: uppercase;
        font-weight: 600;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        transition: opacity 0.4s ease;
      }
      .date-num {
        font-size: clamp(14px, 2.5dvh, 22px);
        font-weight: 300;
        line-height: 1;
        color: var(--text-main);
        transition: all 0.4s ease;
      }

      #toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(15, 23, 42, 0.8);
        color: var(--accent-secondary);
        backdrop-filter: blur(20px) saturate(180%);
        padding: 12px 28px;
        border-radius: 40px;
        font-weight: 900;
        font-size: 10px;
        z-index: 99999;
        opacity: 0;
        border: 1px solid rgba(34, 211, 238, 0.3);
        letter-spacing: 0.25em;
        text-transform: uppercase;
        transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: none;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      }
      #toast.active {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      #theme-veil {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--bg);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s;
      }
      #theme-veil.active {
        opacity: 1;
      }
      /* Theme switching runs through document.startViewTransition() where it
         exists; #theme-veil above is only the fallback path. */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.45s;
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        mix-blend-mode: normal;
      }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-old(root),
        ::view-transition-new(root) {
          animation: none;
        }
      }
      /* Efek saat melakukan lompatan besar */
      #viewport.warping-far .year-block {
        filter: blur(100px) saturate(2);
        opacity: 0;
        transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Efek lorong waktu saat lompatan jauh */
      #viewport.warping-far #infinite-canvas {
        transform: scale(1.4) translateZ(0);
        filter: blur(40px) brightness(1.5) contrast(1.2);
        transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1), filter 1.2s ease-in-out;
        opacity: 0.3;
      }

      /* Efek getaran ringan saat warp dekat */
      #viewport.warping-near #infinite-canvas {
        transform: scale(1.05) translateZ(0);
        filter: blur(10px);
        transition: transform 1.2s ease-out, filter 0.8s ease-out;
      }

      /* Memastikan kursor benar-benar lenyap ke titik tengah */
      #ion-drive.jumping {
        opacity: 0 !important;
        transform: scale(0) translateZ(0);
        transition: opacity 0.4s ease-out, transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
      }

      .keyboard-hints {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        z-index: 9998;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-muted);
        opacity: 0.85;
        transition: opacity 1.2s ease;
        pointer-events: none;
        user-select: none;
      }
      .keyboard-hints.faded {
        opacity: 0.15;
      }
      .keyboard-hints kbd {
        display: inline-block;
        padding: 2px 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: rgba(127, 127, 127, 0.1);
        font-family: inherit;
        font-size: 10px;
        margin: 0 2px;
      }

      /* ── YEAR NAV EDGE BUTTONS ── */
      .year-nav {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        z-index: 9997;
        display: flex;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      #year-nav { left: 16px; }
      #year-nav-end { right: 16px; flex-direction: row-reverse; }
      .year-nav.visible { opacity: 0.65; }
      .year-nav:hover { opacity: 1; }
      .year-nav-btn {
        pointer-events: auto;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.55);
        color: var(--text-main);
        backdrop-filter: blur(14px) saturate(180%);
        -webkit-backdrop-filter: blur(14px) saturate(180%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                    background 0.2s ease,
                    border-color 0.2s ease,
                    opacity 0.25s ease;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      }
      .year-nav-btn:hover {
        background: rgba(34, 211, 238, 0.18);
        border-color: var(--accent-secondary);
        color: var(--accent-secondary);
        transform: scale(1.08);
      }
      .year-nav-btn:active {
        transform: scale(0.94);
      }
      .year-nav-btn.disabled {
        opacity: 0.18;
        pointer-events: none;
      }
      @media (max-width: 720px) {
        .year-nav-btn { width: 38px; height: 38px; }
        #year-nav { left: 8px; }
        #year-nav-end { right: 8px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .year-nav { transition: opacity 0.2s linear; }
        .year-nav-btn { transition: opacity 0.2s linear; }
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader-bar"><div class="loader-progress" id="load-progress"></div></div>
      <div class="loader-text" id="load-status">Synchronizing Neural Network...</div>
    </div>
    <div id="ion-drive" aria-hidden="true"></div>
    <div id="atmosphere" aria-hidden="true"></div>
    <div id="theme-veil" aria-hidden="true"></div>
    <div id="toast" aria-live="polite">READY</div>
    <nav id="year-nav" class="year-nav" aria-label="Previous year">
      <button data-nav="prev" class="year-nav-btn" aria-label="Previous year" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </nav>
    <nav id="year-nav-end" class="year-nav" aria-label="Next year">
      <button data-nav="next" class="year-nav-btn" aria-label="Next year" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </nav>
    <div id="keyboard-hints" class="keyboard-hints">
      <span><kbd>F</kbd> Focus</span>
      <span><kbd>G</kbd> Jump</span>
      <span><kbd>←</kbd><kbd>→</kbd> Day</span>
      <span><kbd>Space</kbd> Today</span>
      <span><kbd>↑</kbd><kbd>↓</kbd> Year</span>
      <span><kbd>T</kbd> Theme</span>
    </div>
    <main id="viewport" aria-label="Temporal grid"><div id="infinite-canvas"></div></main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
