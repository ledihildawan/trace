<!DOCTYPE html>
<html lang="id" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Galactic Odyssey v3.1 - Acoustic Warp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700;900&display=swap" rel="stylesheet" />

    <style>
      /* --- MODERN CSS ENGINE --- */
      @property --ion-x { syntax: '<number>'; inherits: true; initial-value: 0; }
      @property --ion-y { syntax: '<number>'; inherits: true; initial-value: 0; }
      @property --warp-scale { syntax: '<number>'; inherits: true; initial-value: 0.92; }

      :root {
        --accent-primary: #fbbf24;
        --accent-secondary: #22d3ee;
        --today-glow: rgba(59, 130, 246, 0.6);
        --bg: light-dark(#f8fafc, #020617);
        --border: light-dark(#cbd5e1, #1e293b);
        --cell-bg: light-dark(#ffffff, #020617);
        --text-main: light-dark(#0f172a, #f1f5f9);
        --text-muted: light-dark(#64748b, #64748b);
        --ion-color: light-dark(rgba(8, 145, 178, 0.1), rgba(34, 211, 238, 0.12));
        --dust-opacity: light-dark(0.05, 0.15);
      }

      [data-theme='light'] { color-scheme: light; }
      [data-theme='dark'] { color-scheme: dark; }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

      html, body {
        height: 100dvh; width: 100vw; background: var(--bg); color: var(--text-main);
        font-family: 'Space Grotesk', sans-serif; overflow: hidden; perspective: 1200px;
        overscroll-behavior: none;
      }

      /* --- INITIAL LOAD SCREEN --- */
      #loading-screen {
        position: fixed; inset: 0; z-index: 100000; background: #020617;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s;
      }
      #loading-screen.hidden { opacity: 0; visibility: hidden; }
      .loader-text { color: var(--accent-secondary); font-size: 10px; letter-spacing: 0.5em; text-transform: uppercase; font-weight: 900; margin-top: 20px; }
      .loader-bar { width: 150px; height: 1px; background: rgba(34, 211, 238, 0.2); position: relative; overflow: hidden; }
      .loader-progress { position: absolute; height: 100%; width: 0%; background: var(--accent-secondary); transition: width 0.4s; }

      /* --- AUDIO CONTROL UI --- */
      #audio-panel {
        position: fixed; top: 20px; right: 20px; z-index: 99999;
        display: flex; gap: 10px;
      }
      .audio-btn {
        background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border);
        color: var(--text-main); padding: 8px; border-radius: 8px;
        backdrop-filter: blur(10px); cursor: pointer; font-size: 12px;
        transition: all 0.3s;
      }
      .audio-btn:hover { background: var(--accent-secondary); color: #000; }
      .audio-btn.active { border-color: var(--accent-secondary); box-shadow: 0 0 10px var(--accent-secondary); }

      /* --- CORE UI ELEMENTS --- */
      #ion-drive {
        position: fixed; inset: 0; z-index: 5; pointer-events: none;
        background: radial-gradient(var(--glow-size, 600px) circle at calc(var(--ion-x) * 1px) calc(var(--ion-y) * 1px), var(--ion-color) 0%, transparent 70%);
        will-change: background;
      }

      #cursor-wrapper {
        position: fixed; top: 0; left: 0; z-index: 99999;
        pointer-events: none; will-change: transform; opacity: 0;
      }

      #cursor-dot {
        width: 6px; height: 6px; background: var(--accent-secondary); border-radius: 50%;
        box-shadow: 0 0 15px var(--accent-secondary); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      #cursor-wrapper.is-hovering #cursor-dot { transform: scale(3.5); background: var(--accent-primary); }

      #atmosphere {
        position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: var(--dust-opacity);
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        mix-blend-mode: overlay; animation: drift 30s linear infinite;
      }
      @keyframes drift { from { background-position: 0 0; } to { background-position: 200px 200px; } }

      #viewport {
        width: 100vw; height: 100dvh; overflow-y: auto; scroll-snap-type: y mandatory;
        scrollbar-width: none; position: relative; -webkit-overflow-scrolling: touch;
      }
      #viewport::-webkit-scrollbar { display: none; }
      #infinite-canvas { position: relative; width: 100%; contain: layout; }

      .year-block {
        position: absolute; left: 0; width: 100vw; height: 100dvh;
        scroll-snap-align: start; scroll-snap-stop: always;
        display: flex; flex-direction: column; overflow: hidden;
        content-visibility: auto; contain-intrinsic-size: 100vw 100dvh;
        transform-origin: center center;
        transition: transform 0.8s cubic-bezier(0.2, 1, 0.3, 1), filter 0.8s ease, opacity 0.6s ease;
      }
      .year-block:not(.active) { transform: scale(var(--warp-scale)) translateZ(-150px); filter: blur(10px); opacity: 0.35; }

      .grid-container { position: relative; flex: 1; display: flex; background: var(--bg); overflow-x: hidden; scrollbar-width: none; }
      .grid-layer { display: grid; width: 100.1%; margin-left: -0.5px; min-height: 100%; opacity: 0; transition: opacity 0.8s ease; z-index: 2; gap: 0; }
      .year-block.active .grid-layer { opacity: 1; }

      .cell { background: var(--cell-bg); position: relative; contain: strict; box-shadow: inset 0 0 0 0.5px var(--border); min-height: 60px; display: flex; flex-direction: column; transition: background 0.4s ease; }
      .cell.filler { background: transparent; }
      .cell.filler .date-num { opacity: 0.1; }
      .cell.weekend { background: linear-gradient(135deg, rgba(34, 211, 238, 0.05) 0%, transparent 100%); }
      .cell.week-start { background: linear-gradient(135deg, rgba(251, 191, 36, 0.05) 0%, transparent 100%); }
      .cell.week-start::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, var(--accent-primary), transparent); opacity: 0.3; z-index: 3; }
      .cell.month-start { background: linear-gradient(180deg, rgba(34, 211, 238, 0.1) 0%, transparent 100%); box-shadow: inset 0 2px 0 0 var(--accent-secondary), inset 0 0 0 0.5px var(--border); }
      .cell.month-start .info-meta.top-label { color: var(--accent-secondary); font-weight: 900; letter-spacing: 0.15em; }
      .cell.today { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%) !important; z-index: 10; box-shadow: 0 15px 35px -5px var(--today-glow), inset 0 0 0 1px rgba(255, 255, 255, 0.2); }
      .cell.today .date-num { font-weight: 900; color: #fff !important; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3); }
      .cell.today .info-meta { color: rgba(255, 255, 255, 0.9) !important; font-weight: 700; }

      .cell-content { flex: 1; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 12px 4px; z-index: 2; pointer-events: none; }
      .info-meta { font-size: clamp(7px, 0.9dvh, 8px); text-transform: uppercase; font-weight: 600; color: var(--text-muted); letter-spacing: 0.1em; }
      .date-num { font-size: clamp(18px, 3dvh, 26px); font-weight: 300; line-height: 1; color: var(--text-main); }
      .watermark-embedded { position: absolute; top: 0; right: 5%; height: 100%; display: flex; align-items: center; font-size: clamp(100px, 30dvh, 400px); font-weight: 900; color: rgba(148, 163, 184, 0.03); writing-mode: vertical-rl; pointer-events: none; z-index: 1; }

      #mode-toast {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
        background: rgba(34, 211, 238, 0.1); color: var(--accent-secondary);
        backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        padding: 12px 28px; border-radius: 40px; font-weight: 900;
        font-size: 10px; z-index: 99999; opacity: 0;
        border: 1px solid rgba(34, 211, 238, 0.3);
        letter-spacing: 0.25em; text-transform: uppercase;
        transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        pointer-events: none; box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      }
      #mode-toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }

      #theme-veil { position: fixed; inset: 0; z-index: 9999; background: var(--bg); pointer-events: none; opacity: 0; transition: opacity 0.5s; }
      #theme-veil.active { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="audio-panel">
      <button class="audio-btn" id="btn-ambience">ENABLE AMBIENCE</button>
    </div>

    <div id="loading-screen">
      <div class="loader-bar"><div class="loader-progress" id="load-progress"></div></div>
      <div class="loader-text" id="load-status">Initializing Star Map...</div>
    </div>

    <div id="ion-drive"></div>
    <div id="cursor-wrapper"><div id="cursor-dot"></div></div>
    <div id="atmosphere"></div>
    <div id="theme-veil"></div>
    <div id="mode-toast">SYSTEMS ONLINE</div>

    <main id="viewport"><div id="infinite-canvas"></div></main>

    <script type="module">
      /**
       * ACOUSTIC ENGINE (Web Audio API)
       */
      class AcousticEngine {
        constructor() {
          this.ctx = null;
          this.masterGain = null;
          this.ambienceActive = false;
          this.ambientLoops = [];
        }

        init() {
          if (this.ctx) return;
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          this.masterGain = this.ctx.createGain();
          this.masterGain.connect(this.ctx.destination);
          this.masterGain.gain.value = 0.5;
        }

        #osc(freq, type, dur, vol = 0.1) {
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start();
          osc.stop(this.ctx.currentTime + dur);
        }

        playJump() {
          this.#osc(150, 'sine', 1.5, 0.3);
          this.#osc(300, 'triangle', 0.5, 0.1);
        }

        playHover() {
          this.#osc(800, 'sine', 0.1, 0.02);
        }

        playThemeToggle() {
          this.#osc(440, 'square', 0.2, 0.05);
          setTimeout(() => this.#osc(880, 'square', 0.2, 0.03), 100);
        }

        playConfirmation() {
          this.#osc(1200, 'sine', 0.1, 0.05);
          setTimeout(() => this.#osc(1600, 'sine', 0.1, 0.05), 50);
        }

        playYearChange() {
          this.#osc(100, 'sawtooth', 0.3, 0.05);
        }

        playWarp(speed) {
          const s = Math.min(speed / 2000, 1);
          this.#osc(50 + (s * 400), 'sawtooth', 0.1, 0.02 * s);
        }

        startAmbience() {
          if (this.ambienceActive) return;
          this.ambienceActive = true;
          this.#scheduleAmbience();
        }

        stopAmbience() {
          this.ambienceActive = false;
        }

        #scheduleAmbience() {
          if (!this.ambienceActive) return;
          
          const sounds = [
            { n: "PULSE", d: 4, f: 60, v: 0.05, wait: 8 },
            { n: "NEBULA WIND", d: 8, f: 120, v: 0.03, wait: 12 },
            { n: "ENGINE IDLE", d: 13, f: 40, v: 0.04, wait: 6 },
            { n: "DISTANT STELLAR", d: 20, f: 800, v: 0.01, wait: 10 }
          ];

          const pick = sounds[Math.floor(Math.random() * sounds.length)];
          this.#playAmbientLayer(pick.f, pick.d, pick.v);
          
          setTimeout(() => this.#scheduleAmbience(), (pick.d + pick.wait) * 1000);
        }

        #playAmbientLayer(freq, dur, vol) {
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(freq * 0.8, this.ctx.currentTime + dur);

          filter.type = 'lowpass';
          filter.frequency.value = 500;

          gain.gain.setValueAtTime(0, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + dur/2);
          gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + dur);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);

          osc.start();
          osc.stop(this.ctx.currentTime + dur);
        }
      }

      /**
       * MAIN GRID ENGINE
       */
      class GridArchitect {
        #viewport = document.getElementById('viewport');
        #canvas = document.getElementById('infinite-canvas');
        #cursorWrapper = document.getElementById('cursor-wrapper');
        #ionDrive = document.getElementById('ion-drive');
        #toast = document.getElementById('mode-toast');
        #audio = new AcousticEngine();
        #toastTimer = null;

        #today = new Date();
        #activeYears = new Map();
        #lastScrollPos = 0;
        #lastScrollTime = Date.now();
        #mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        #current = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        #monthsShort = ['JAN', 'FEB', 'MAR', 'APR', 'MEI', 'JUN', 'JUL', 'AGS', 'SEP', 'OKT', 'NOV', 'DES'];
        #daysShort = ['MIN', 'SEN', 'SEL', 'RAB', 'KAM', 'JUM', 'SAB'];
        #currentActiveYear = null;

        #isRandomMode = false;

        constructor() {
          this.totalYears = 2000;
          this.yearHeight = window.innerHeight;
          this.startY = (this.totalYears / 2) * this.yearHeight;
          this.#runInitialization();
        }

        async #runInitialization() {
          const bar = document.getElementById('load-progress');
          const status = document.getElementById('load-status');
          const steps = [
            { p: 20, t: "Fetching Galactic Coordinates..." },
            { p: 45, t: "Synchronizing Solar Orbits..." },
            { p: 75, t: "Generating Nebula Structures..." },
            { p: 100, t: "Bridge Connection Established." }
          ];

          for (const step of steps) {
            await new Promise(r => setTimeout(r, Math.random() * 600 + 400));
            bar.style.width = `${step.p}%`;
            status.innerText = step.t;
          }

          this.#init();
          setTimeout(() => {
            document.getElementById('loading-screen').classList.add('hidden');
            // Play Initial Warp Sound
            this.#audio.init();
            this.#audio.playJump();
          }, 800);
        }

        async #init() {
          this.#applyTheme(localStorage.getItem('theme') || 'dark');
          this.#canvas.style.height = `${this.totalYears * this.yearHeight}px`;
          this.#viewport.scrollTop = this.startY;

          this.observer = new IntersectionObserver((entries) => {
            entries.forEach(e => {
              const block = e.target;
              const year = parseInt(block.dataset.year);
              block.classList.toggle('active', e.isIntersecting);
              
              if (e.isIntersecting && year !== this.#currentActiveYear) {
                this.#currentActiveYear = year;
                this.#audio.playYearChange();
              }

              if (e.isIntersecting && this.#viewport.scrollTop < this.#lastScrollPos) {
                const container = block.querySelector('.grid-container');
                if (container && block.classList.contains('is-scrolling')) container.scrollTop = container.scrollHeight;
              }
              this.#lastScrollPos = this.#viewport.scrollTop;
            });
          }, { threshold: 0.1, rootMargin: '10% 0px' });

          this.#setupListeners();
          this.#cursorLoop();
          this.#render();
          setTimeout(() => this.jumpToToday(true), 200);
        }

        #showToast(msg) {
          clearTimeout(this.#toastTimer);
          this.#toast.innerText = msg;
          this.#toast.classList.add('active');
          this.#toastTimer = setTimeout(() => this.#toast.classList.remove('active'), 2500);
          this.#audio.playConfirmation();
        }

        #setMode(isRandom) {
          if (this.#isRandomMode === isRandom) return;
          this.#isRandomMode = isRandom;
          this.#activeYears.forEach(b => { this.observer.unobserve(b); b.remove(); });
          this.#activeYears.clear();
          this.#render();
          this.#showToast(isRandom ? "NEBULA DYNAMIC STRUCTURE ACTIVE" : "MONDAY ALIGNED ORBIT RESTORED");
        }

        jumpToToday(isInitial = false) {
          this.#viewport.scrollTo({ top: this.startY, behavior: 'smooth' });
          if(!isInitial) {
            this.#showToast("WARPING TO LOCAL COORDINATES");
            this.#audio.playJump();
          }
          
          setTimeout(() => {
            const block = this.#activeYears.get(this.#today.getFullYear());
            if (block && block.classList.contains('is-scrolling')) {
              const todayCell = block.querySelector('.cell.today');
              const container = block.querySelector('.grid-container');
              if (todayCell && container) {
                container.scrollTo({ top: todayCell.offsetTop - window.innerHeight / 3, behavior: 'smooth' });
              }
            }
          }, 650);
        }

        #setupListeners() {
          const ambBtn = document.getElementById('btn-ambience');
          ambBtn.addEventListener('click', () => {
            this.#audio.init();
            if (!this.#audio.ambienceActive) {
              this.#audio.startAmbience();
              ambBtn.innerText = "MUTE AMBIENCE";
              ambBtn.classList.add('active');
              this.#showToast("AMBIENCE ENGINE ONLINE");
            } else {
              this.#audio.stopAmbience();
              ambBtn.innerText = "ENABLE AMBIENCE";
              ambBtn.classList.remove('active');
              this.#showToast("AMBIENCE ENGINE OFFLINE");
            }
          });

          window.addEventListener('pointermove', (e) => {
            this.#mouse.x = e.clientX; this.#mouse.y = e.clientY;
            if (e.pointerType === 'mouse') this.#cursorWrapper.style.opacity = '1';
            this.#audio.init(); // Resume context on gesture
          }, { passive: true });

          document.addEventListener('mouseover', (e) => {
            const cell = e.target.closest('.cell');
            if (cell && !cell.classList.contains('filler')) {
              this.#cursorWrapper.classList.add('is-hovering');
              this.#ionDrive.style.setProperty('--glow-size', '800px');
              this.#audio.playHover();
            }
          });

          document.addEventListener('mouseout', (e) => {
            if (e.target.closest('.cell')) {
              this.#cursorWrapper.classList.remove('is-hovering');
              this.#ionDrive.style.setProperty('--glow-size', '600px');
            }
          });

          this.#viewport.addEventListener('scroll', () => {
            const now = Date.now();
            const deltaDist = Math.abs(this.#viewport.scrollTop - this.#lastScrollPos);
            const deltaTime = now - this.#lastScrollTime;
            const speed = deltaDist / (deltaTime / 1000);

            if (speed > 500) this.#audio.playWarp(speed);

            this.#lastScrollTime = now;
            requestAnimationFrame(() => { this.#render(); this.#handleParallax(); });
          }, { passive: true });

          window.addEventListener('keydown', (e) => {
            this.#audio.init();
            const key = e.key.toLowerCase();
            if (key === 't') { 
              this.#toggleTheme(); 
              this.#audio.playThemeToggle();
              const current = document.documentElement.getAttribute('data-theme');
              this.#showToast(`ADJUSTING LIGHT: ${current === 'dark' ? 'LIGHT' : 'DARK'}`); 
            }
            if (key === ' ') { e.preventDefault(); this.jumpToToday(); }
            if (key === 'r') this.#setMode(true);
            if (key === 's') this.#setMode(false);
          });

          window.addEventListener('resize', () => location.reload());
        }

        #applyTheme(theme) {
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        }

        #toggleTheme() {
          const veil = document.getElementById('theme-veil');
          veil.classList.add('active');
          setTimeout(() => {
            const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            this.#applyTheme(next);
            localStorage.setItem('theme', next);
            setTimeout(() => veil.classList.remove('active'), 200);
          }, 400);
        }

        #cursorLoop() {
          if (window.matchMedia('(pointer: coarse)').matches) return;
          this.#current.x += (this.#mouse.x - this.#current.x) * 0.18;
          this.#current.y += (this.#mouse.y - this.#current.y) * 0.18;
          this.#cursorWrapper.style.transform = `translate3d(${this.#current.x}px, ${this.#current.y}px, 0)`;
          this.#ionDrive.style.setProperty('--ion-x', this.#current.x);
          this.#ionDrive.style.setProperty('--ion-y', this.#current.y);
          requestAnimationFrame(() => this.#cursorLoop());
        }

        #handleParallax() {
          const idx = Math.round(this.#viewport.scrollTop / this.yearHeight);
          const year = this.#today.getFullYear() + (idx - this.totalYears / 2);
          const block = this.#activeYears.get(year);
          if (block && !block.classList.contains('is-scrolling')) {
            const offset = (this.#viewport.scrollTop % this.yearHeight) - (this.yearHeight / 2);
            const wm = block.querySelector('.watermark-embedded');
            if (wm) wm.style.transform = `translate3d(0, ${offset * 0.06}px, 0)`;
          }
        }

        #render() {
          const idx = Math.round(this.#viewport.scrollTop / this.yearHeight);
          const baseYear = this.#today.getFullYear() + (idx - this.totalYears / 2);
          for (let i = -1; i <= 1; i++) this.#drawYear(baseYear + i, (idx + i) * this.yearHeight);
          this.#activeYears.forEach((block, year) => {
            if (Math.abs(year - baseYear) > 1) {
              this.observer.unobserve(block);
              block.remove();
              this.#activeYears.delete(year);
            }
          });
        }

        #drawYear(year, yPos) {
          if (this.#activeYears.has(year)) return;
          const block = document.createElement('section');
          block.className = 'year-block';
          block.dataset.year = year;
          block.style.top = `${yPos}px`;
          const jan1 = new Date(year, 0, 1);
          const daysInYear = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0 ? 366 : 365;
          const vw = window.innerWidth, vh = window.innerHeight;
          let cols, globalOffset;

          if (this.#isRandomMode && vw >= 600) {
            cols = Math.ceil(Math.sqrt(365 * (vw / vh)));
            globalOffset = Math.floor(jan1.getTime() / 86400000) % cols;
          } else {
            cols = vw < 600 ? 7 : (vw < 1200 ? 14 : 21);
            globalOffset = (jan1.getDay() + 6) % 7; 
          }

          let rows = Math.ceil((daysInYear + globalOffset) / cols);
          const isOverflowing = vh / rows < 60;
          if (isOverflowing) block.classList.add('is-scrolling');

          const iterDate = new Date(year, 0, 1 - globalOffset);
          const todayStr = this.#today.toDateString();
          let html = `<div class="grid-container" style="${isOverflowing ? 'overflow-y: auto;' : 'overflow-y: hidden;'}">
                        <div class="watermark-embedded">${year}</div>
                        <div class="grid-layer" style="grid-template-columns:repeat(${cols},1fr); height: ${isOverflowing ? 'auto' : '100%'};">`;

          for (let s = 0; s < cols * rows; s++) {
            const isMain = iterDate.getFullYear() === year;
            const dDate = iterDate.getDate(), dMonth = iterDate.getMonth(), dDay = iterDate.getDay();
            const isToday = iterDate.toDateString() === todayStr && isMain;
            let cls = `cell ${!isMain ? 'filler' : ''} ${isToday ? 'today' : ''}`;
            if (isMain) {
              if (dDate === 1) cls += ' month-start';
              if (dDay === 0 || dDay === 6) cls += ' weekend';
              if (dDay === 1) cls += ' week-start';
            }
            const showMonth = isMain && (dDate === 1 || s === globalOffset);
            html += `<div class="${cls}"><div class="cell-content">
                        <span class="info-meta ${dDate === 1 && isMain ? 'top-label' : ''}">${showMonth ? this.#monthsShort[dMonth] : ''}</span>
                        <span class="date-num">${dDate}</span>
                        <span class="info-meta">${isMain ? this.#daysShort[dDay] : ''}</span>
                      </div></div>`;
            iterDate.setDate(dDate + 1);
          }
          block.innerHTML = html + `</div></div>`;
          this.#canvas.appendChild(block);
          this.#activeYears.set(year, block);
          this.observer.observe(block);
        }
      }
      new GridArchitect();
    </script>
  </body>
</html>
